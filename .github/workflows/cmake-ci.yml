name: CMake CI

on:
  push:
    branches:
      - develop   # Git Flow的长期开发分支
      - feature/**  # 可选：针对功能分支的CI
  pull_request:
    branches:
      - master     # Git Flow的主分支（稳定版）
      - release/**  # 可选：发布分支触发

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整Git历史（可选）

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
        
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake
        
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          curl -L -o mingw.7z https://github.com/niXman/mingw-builds-binaries/releases/download/14.2.0-rt_v12-rev2/x86_64-14.2.0-release-posix-seh-msvcrt-rt_v12-rev2.7z
          7z x mingw.7z -o"C:/msvcrt-mingw"
          echo "C:/msvcrt-mingw/mingw64/bin" >> $GITHUB_PATH

