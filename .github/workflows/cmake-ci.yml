name: CMake CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - master
      - release/**
      - develop

jobs:
  build:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[WIP]')) ||
      (github.event_name == 'pull_request')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        include:
          - os: windows-latest
            generator: "MinGW Makefiles"
            mingw_url: https://github.com/niXman/mingw-builds-binaries/releases/download/14.2.0-rt_v12-rev2/x86_64-14.2.0-release-posix-seh-msvcrt-rt_v12-rev2.7z
            mingw_path: C:/msvcrt-mingw/mingw64/bin
            qt_arch: win64_mingw
            toolset: mingw
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            qt_arch: linux_gcc_64
            toolset: gcc
          - os: macos-latest
            generator: "Unix Makefiles"
            qt_arch: clang_64
            toolset: clang

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          case "${{ matrix.os }}" in
            # ubuntu-latest)
            #   sudo apt-get update
            #   sudo apt-get install -y build-essential
            #   ;;
            windows-latest)

              curl -L -o mingw.7z "${{ matrix.mingw_url }}"
              7z x mingw.7z -o"C:/msvcrt-mingw"
              rm -f mingw.7z

              echo "${{ matrix.mingw_path }}" | tr -d '\\' | sed 's|//|/|g' >> $GITHUB_PATH
              ;;
          esac
        shell: bash
        id: install-dependencies

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          arch: ${{ matrix.qt_arch }}
          cache: true

      # 统一配置步骤
      - name: Configure CMake
        run: |
          # export BOOST_ROOT=

          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ steps.install-qt.outputs.qt-path }}" \
            -G "${{ matrix.generator }}"
        shell: bash

      - name: Build project
        run: |
          cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: |
          cd build
          ctest -C ${{ matrix.build_type }} --output-on-failure