name: CMake CI

on:
  push:
    branches-ignore: master
  pull_request:
    branches:
      - master
      - release/**
      - develop

jobs:
  build:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[WIP]')) ||
      (github.event_name == 'pull_request')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        os: [linux, macos, windows]
        include:
          - os: windows
            qt_arch: win64_mingw
            runner: windows-latest
            distro: Windows
          - os: linux
            qt_arch: linux_gcc_64
            runner: ubuntu-latest
            distro: Ubuntu
          - os: macos
            qt_arch: clang_64
            runner: macos-latest
            distro: macOS

    env:
      CMAKE_VERSION: 4.3.1
      CMAKE_MINOR_VERSION: 4.3
      BUILD_TYPE: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        id: get-cmake
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Update Compiler
        uses: ./.github/actions/update-compiler
        with:
          cmake-path: ${{ steps.get-cmake.outputs.cmake-path }}
          cmake-minor-version: ${{ env.CMAKE_MINOR_VERSION }}

      - name: Setup Conan
        uses: ./.github/actions/setup-conan
        
      - name: Configure CMake 
        id: configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -G "Ninja" \
            -D CMAKE_C_COMPILER="$C_COMPILER" \
            -D CMAKE_CXX_COMPILER="$CXX_COMPILER" \
            -D THIRDPARTY_CLANG_EXECUTABLE="$C_COMPILER" \
            -D THIRDPARTY_CLANGXX_EXECUTABLE="$CXX_COMPILER" \
            -D DUMP_PROJECT_VERSION="${{ github.workspace }}/build/PROJECT_VERSION"
          echo "PROJECT_VERSION=$(cat build/PROJECT_VERSION)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build project
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }}
        shell: bash

      - name: Run tests
        shell: bash
        run: |
          cd bin
          ./tests || true
          rm ./tests || true
          rm -rf log || true
          rm *.json5 || true
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TheCalculater-${{ matrix.distro }}-${{ steps.configure.outputs.PROJECT_VERSION }}
          path: bin/
          retention-days: 2

      - name: Start upterm SSL debugging
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 5
        if: ${{ (failure() || contains(github.event.head_commit.message, '[forcedbg]')) && (contains(github.event.head_commit.message, format('[dbg{0}]', matrix.os))) }}