      - name: Configure CMake (Ubuntu, macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
      
      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
