name: CMake CI

on:
  push:
    branches-ignore: master
  pull_request:
    branches:
      - master
      - release/**
      - develop

jobs:
  build:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[WIP]')) ||
      (github.event_name == 'pull_request')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            qt_arch: win64_mingw
            c_compiler: C:/msys64/mingw64/bin/clang.exe
            cxx_compiler: C:/msys64/mingw64/bin/clang++.exe
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
            c_compiler: /usr/bin/clang
            cxx_compiler: /usr/bin/clang++
          - os: macos-latest
            qt_arch: clang_64
            c_compiler: /opt/homebrew/opt/llvm/bin/clang
            cxx_compiler: /opt/homebrew/opt/llvm/bin/clang++

    env:
      BOOST_URL: https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.gz
      LIBBACKTRACE_URL: https://github.com/ianlancetaylor/libbacktrace.git

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        id: get-cmake

      - name: Update Compiler
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-x86_64-clang
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y clang libgcc-15-dev libstdc++-15-dev
          else
            brew update
            brew install llvm

            LLVM_PREFIX=$(brew --prefix llvm)

            echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV

            echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
            echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV

            echo "LDFLAGS=-L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lunwind" >> $GITHUB_ENV
            echo "CPPFLAGS=-I$LLVM_PREFIX/include" >> $GITHUB_ENV

            echo "CMAKE_PREFIX_PATH=$LLVM_PREFIX" >> $GITHUB_ENV

            # Do you know how dumb it is?
            sed -i '' '3c\
            set(_clang_modules_json_impl "c++/libc++")
            ' ${{ steps.get-cmake.outputs.cmake-path }}../../Modules/Compiler/Clang-CXX-CXXImportStd.cmake
          fi
        shell: bash

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Restore Boost
        uses: actions/cache/restore@v4
        id: boost-cache
        with:
          path: ${{ runner.temp }}/boost
          key: boost-1.88.0
      - name: Install Boost headers
        shell: bash
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BOOST_DIR="$(cygpath -m "${{ runner.temp }}/boost")"
          else
            BOOST_DIR="${{ runner.temp }}/boost"
          fi

          mkdir -p $BOOST_DIR
          curl -L -o boost.tar.gz "$BOOST_URL"

          tar -xzf boost.tar.gz -C $BOOST_DIR --strip-components=1
      - name: Save Boost
        uses: actions/cache/save@v4
        if: steps.boost-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/boost
          key: boost-1.88.0

      - name: Restore libbacktrace
        uses: actions/cache/restore@v4
        id: libbacktrace-cache
        with:
          path: ${{ runner.temp }}/libbacktrace
          key: libbacktrace-${{ matrix.os }}
      - name: Build libbacktrace
        shell: bash
        if: steps.libbacktrace-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd $(cygpath -m "${{ runner.temp }}")
          else
            cd ${{ runner.temp }}
          fi
          git clone $LIBBACKTRACE_URL
          cd libbacktrace
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./configure --host x86_64-w64-mingw32 --target x86_64-w64-mingw32 --build x86_64-w64-mingw32
          else
            ./configure
          fi
          make
      - name: Save libbacktrace
        uses: actions/cache/save@v4
        if: steps.libbacktrace-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/libbacktrace
          key: libbacktrace-${{ matrix.os }}

      - name: Restore jsoncpp
        uses: actions/cache/restore@v4
        id: jsoncpp-cache
        with:
          path: ${{ runner.temp }}/jsoncpp
          key: jsoncpp-${{ matrix.os }}-${{ matrix.build_type }}
          restore-keys: jsoncpp-${{ matrix.os }}-
      - name: Build jsoncpp
        shell: bash
        if: ${{ steps.jsoncpp-cache.outputs.cache-hit != 'true' && steps.jsoncpp-cache.outputs.cache-matched-key == '' }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd $(cygpath -m "${{ runner.temp }}")
          else
            cd ${{ runner.temp }}
          fi
          git clone https://github.com/prbegd/jsoncpp.git
          cd jsoncpp
          mkdir build
          cd build
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF -DBUILD_OBJECT_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DJSONCPP_WITH_TESTS=OFF -G "Ninja" ../
          else
            cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF -DBUILD_OBJECT_LIBS=OFF -DJSONCPP_WITH_TESTS=OFF -G "Ninja" ../
          fi
          cmake --build .
      - name: Save jsoncpp
        uses: actions/cache/save@v4
        if: ${{ steps.jsoncpp-cache.outputs.cache-hit != 'true' && steps.jsoncpp-cache.outputs.cache-matched-key == '' }}
        with:
          path: ${{ runner.temp }}/jsoncpp
          key: jsoncpp-${{ matrix.os }}-${{ matrix.build_type }}
        
      - name: Configure CMake 
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            boostIncludeDir="$(cygpath -m "${{ runner.temp }}")/boost"
          else
            boostIncludeDir="${{ runner.temp }}/boost"
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ steps.install-qt.outputs.qt-path }}" \
            -G "Ninja" \
            -D BOOST_INCLUDE_DIR="${boostIncludeDir}" \
            -D BACKTRACE_LIBRARY_PATH="${{ runner.temp }}/libbacktrace/.libs" \
            -D JSONCPP_LIBRARY_PATH="${{ runner.temp }}/jsoncpp/build/lib" \
            -D CMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
        shell: bash

      - name: Build project
        run: |
          cmake --build build --config ${{ matrix.build_type }}
        shell: bash

      - name: Run tests
        shell: bash
        run: |
          cd bin
          # ctest -C ${{ matrix.build_type }} --output-on-failure
          ./tests
        continue-on-error: true

      - name: Clean tests
        shell: bash
        run: |
          cd bin
          rm ./tests || true
          rm -rf log || true
          rm *.json5 || true

        # For some personal reason, I refuse to deploy the artifact on macOS.
        # (Definitely not because I don't have a MacOS device)
      - name: Deploy project
        if: ${{ matrix.build_type == 'Release' }}
        shell: bash
        run: |
          cd bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            windeployqt TheCalculater.exe --no-translations --no-network --no-svg --no-system-dxc-compiler --no-system-d3d-compiler --no-opengl-sw
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            chmod 770 ../scripts/linuxcopylib.sh
            ../scripts/linuxcopylib.sh
            # A little hacky way to fix but it works, right?
            for lib in platforms/*.so; do
              patchelf --set-rpath \$ORIGIN/.. $lib
            done
          fi

      - name: Upload artifact
        if: ${{ matrix.build_type == 'Release' && matrix.os != 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: TheCalculater-${{ matrix.os }}
          path: bin/
          retention-days: 2