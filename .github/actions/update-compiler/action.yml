name: Update Compiler
description: Setup LLVM compiler and install libstdc++15 for Linux.
inputs:
  cmake-path:
    description: "The path to the installed CMake executable"
    required: true
  cmake-minor-version:
    description: "The minor version of CMake. e.g. 4.3"
    required: true

runs:
  using: 'composite'
  steps:
    - run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-x86_64-clang mingw-w64-x86_64-lld

          echo "C_COMPILER=C:/msys64/mingw64/bin/clang.exe" >> $GITHUB_ENV
          echo "CXX_COMPILER=C:/msys64/mingw64/bin/clang++.exe" >> $GITHUB_ENV
          sed -i "1i\C:/msys64/mingw64/bin" $GITHUB_PATH
        elif [ "${{ runner.os }}" = "Linux" ]; then
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libstdc++-15-dev

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-22 100

          # You know what's the dumbest thing on earth?
          sudo sed -i '2011d' /usr/include/c++/15/bits/std.cc
          sudo sed -i '2012d' /usr/include/c++/15/bits/std.cc

          echo "C_COMPILER=/usr/bin/clang-22" >> $GITHUB_ENV
          echo "CXX_COMPILER=/usr/bin/clang++-22" >> $GITHUB_ENV
          echo "LDFLAGS=-L/usr/lib/llvm-22/lib" >> $GITHUB_ENV
        elif [ "${{ runner.os }}" = "macOS" ]; then
          brew update
          brew install llvm lld

          LLVM_PREFIX=$(brew --prefix llvm)

          echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV

          echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV

          echo "LDFLAGS=-L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lunwind" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$LLVM_PREFIX/include" >> $GITHUB_ENV

          echo "CMAKE_PREFIX_PATH=$LLVM_PREFIX" >> $GITHUB_ENV

          # Do you know how dumb it is?
          sed -i '' '3c\
          set(_clang_modules_json_impl "c++/libc++")
          ' ${{ inputs.cmake-path }}/../share/cmake-${{ inputs.cmake-minor-version }}/Modules/Compiler/Clang-CXX-CXXImportStd.cmake

          echo "C_COMPILER=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
          echo "CXX_COMPILER=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
          sed -i '' '1i\
          $LLVM_PREFIX/bin' $GITHUB_PATH
        fi
      shell: bash
